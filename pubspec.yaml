name: aone_ui
description: AOne agentic AI interface built with Flutter
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  flutter_markdown_plus: ^1.0.7
  flutter_dotenv: ^5.1.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
