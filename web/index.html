<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="robots" content="noindex">
  <meta name="description" content="AI-powered TestReady CDL practice exam chat.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AI Quiz TestReady">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI Quiz · TestReady CDL</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Google ad slot hook for publisher ads. The Flutter canvas can't render
    HTML ads, so this DOM container is reserved for a host ad script. The app
    draws its own styled "Advertisement" placeholder at the top of the quiz.
  -->
  <div id="ad-slot-top" style="display:none;" data-ad-slot="ai-exam-top"></div>

  <!--
    Loading-screen ad. While the quiz waits for the question API to cold-start
    (the longest dwell on the whole app), the Dart loader unhides this overlay
    via #loading-ad. To activate a real AdSense unit: create a Display ad unit
    in the AdSense dashboard for publisher ca-pub-4751583089482999 and paste
    its numeric ID into LOADING_AD_SLOT below. Leave it empty and nothing ships.
  -->
  <div id="loading-ad" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:320px;max-width:90vw;display:none;z-index:20;">
    <ins class="adsbygoogle"
         style="display:inline-block;width:320px;height:100px"
         data-ad-client="ca-pub-4751583089482999"
         data-ad-slot=""></ins>
  </div>
  <script>
    window.LOADING_AD_SLOT = ''; // ← paste the AdSense ad unit ID to activate
    if (window.LOADING_AD_SLOT) {
      document.addEventListener('DOMContentLoaded', function () {
        var overlay = document.getElementById('loading-ad');
        var ins = overlay && overlay.querySelector('ins');
        if (!ins) return;
        ins.setAttribute('data-ad-slot', window.LOADING_AD_SLOT);
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4751583089482999';
        s.crossOrigin = 'anonymous';
        s.onload = function () { (window.adsbygoogle = window.adsbygoogle || []).push({}); };
        document.head.appendChild(s);
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
